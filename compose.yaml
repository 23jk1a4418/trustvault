services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-this-password}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/trustvault
      DATABASE_USER: trustvault
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-change-this-password}
      STORAGE_DIR: /var/trustvault/files
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - document-files:/var/trustvault/files
    depends_on:
      database:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
volumes:
  database-data:
  document-files:
