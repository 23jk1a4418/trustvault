server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/trustvault;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  h2:
    console:
      enabled: false
app:
  storage-dir: ${STORAGE_DIR:./uploads}
  seed: ${SEED_DEMO:true}
